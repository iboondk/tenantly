# gqlgen configuration. Schema first: edit internal/graph/schema.graphqls, then
# run `make gqlgen`. The generated files are committed, so a clean run leaves
# the tree unchanged.
schema:
  - internal/graph/schema.graphqls

exec:
  filename: internal/graph/generated/generated.go
  package: generated

model:
  filename: internal/graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph

# UUID values are uuid.UUID. The marshallers live in internal/graph/model/uuid.go.
# gqlgen finds MarshalUUID and UnmarshalUUID in the package named by the model.
models:
  UUID:
    model:
      - github.com/iboondk/tenantly/internal/graph/model.UUID
